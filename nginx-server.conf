# MekoTools — Auslieferung der großen Modelldateien.
#
# Diese Datei ERSETZT die Vorgabe-Serverdatei des nginx-Abbilds (als ganze
# Serverdatei, nicht als Bruchstück: conf.d/ wird im http-Zusammenhang
# eingelesen, dort ist "location" nicht erlaubt).
#
# Die Kopfzeilen spiegeln genau das Verhalten, das bisher auf flip galt:
#   * Gewichte und Stimmen tragen ihre Prüfsumme im Namen bzw. ändern sich nur
#     mit einem neuen Abbild -> ein Jahr unveränderlich. Ohne diese Regel lädt
#     der Browser 276 MB bei jedem Besuch neu (genau die Beschwerde vom 08.10.).
#   * Rechenkern und kleine Textdateien: "no-cache" — jedes Mal rückfragen,
#     damit kein alter Stand klebt. Gecacht wird über den Service Worker.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;

    # 1. Sprachmodell: Gewichte (276 MB) und Rechenkern (4,8 MB).
    location ^~ /modelle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location ^~ /wasm/ {
        # Der Browser übersetzt den Rechenkern im Strom ("instantiateStreaming")
        # und verweigert das bei falschem Typ. Deshalb ausdrücklich festlegen,
        # statt sich auf die Typentabelle des Abbilds zu verlassen.
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 2. Vorlesen: Stimmen (92 MB) — Prüfsumme steckt im Dateinamen.
    location ~ "^/stimmen/[a-zA-Z0-9_]+-[0-9a-f]{8}\.onnx$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    # Rechenkern und Stimmenliste: nicht unveränderlich.
    location ~ "^/(sherpa-onnx-wasm-main-tts\.(js|wasm|data)|sherpa-onnx-tts\.js|sherpa-onnx-tts\.worker\.js|stimmen/stimmen\.json)$" {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location = /sherpa-onnx-wasm-main-tts.wasm {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # 3. Hier liegen nur Dateien — nichts anderes wird ausgeliefert.
    location / {
        try_files $uri =404;
    }

    # Übertragung verkleinern (der Rechenkern ist 13,7 MB, roh gut dreifach so groß).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/wasm text/css application/javascript application/json text/plain;
}
